name: sync-gsd-core

on:
  schedule:
    # Daily at 03:17 UTC — off-peak registry polling.
    - cron: '17 3 * * *'
  workflow_dispatch: # manual trigger for immediate sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # rc-era @deepseek-ai/dsh-* peer graph is incomplete; the lockfile is
        # maintained with the same flag by the bump step below.
        run: npm ci --legacy-peer-deps

      - name: Check for gsd-core updates
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').dependencies['@opengsd/gsd-core'].replace(/^[\^~]/, '')")
          LATEST=$(npm view @opengsd/gsd-core version)
          echo "current=$CURRENT"
          echo "latest=$LATEST"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up-to-date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and update lockfile
        if: steps.check.outputs.up-to-date == 'false'
        run: |
          # In-place key edit keeps the diff to the version number only
          # (npm pkg set reorders keys and would churn the manifest).
          node -e "
            const fs = require('node:fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.dependencies['@opengsd/gsd-core'] = '${{ steps.check.outputs.latest }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          npm install --package-lock-only --legacy-peer-deps

      - name: Build to validate command surface
        if: steps.check.outputs.up-to-date == 'false'
        run: |
          npm run build
          node --input-type=module -e "
            const m = await import('./lib/index.js');
            const root = m.resolveVendorRoot({includeBudgetChars:0,stateCapChars:0,orientation:true});
            const fs = await import('node:fs');
            const count = fs.readdirSync(root + '/commands/gsd').length;
            console.log('gsd commands available:', count);
            if (count === 0) process.exit(1);
          "

      - name: Commit and push
        if: steps.check.outputs.up-to-date == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: bump @opengsd/gsd-core to ${{ steps.check.outputs.latest }}"
          git push
